<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forlenza Rio | CRM Gestionale</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      :root {
        --brand-color: #0b394f; --brand-light: #155573; --accent-color: #95a5a6; 
        --text-dark: #2c3e50; --bg-light: #f4f6f7; --success: #27ae60; --danger: #c0392b; --radius: 0px; 
      }
      body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; background-color: var(--bg-light); color: var(--text-dark); }
      .navbar { background-color: var(--brand-color); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; color: white; border-bottom: 4px solid var(--accent-color); position: sticky; top: 0; z-index: 1000; }
      .logo-text { font-weight: 700; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
      .logo-subtext { font-size: 11px; font-style: italic; color: #ecf0f1; letter-spacing: 1px; margin-top: 2px; }
      button { padding: 14px 25px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
      .btn-primary { background-color: white; color: var(--brand-color); }
      .btn-primary:hover { background-color: var(--accent-color); color: white; }
      .btn-action { background-color: var(--brand-color); color: white; width: 100%; padding: 16px; font-size: 15px; margin-top: 15px; }
      .btn-action:hover { background-color: var(--brand-light); }
      
      .login-box { background: white; max-width: 450px; margin: 100px auto; padding: 50px 40px; border-top: 5px solid var(--brand-color); box-shadow: 0 5px 20px rgba(0,0,0,0.05); text-align: center; }
      .login-box h2 { color: var(--brand-color); margin-bottom: 15px; text-transform: uppercase; }
      .input-group { position: relative; margin-bottom: 20px; }
      .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #95a5a6; }
      .input-full { width: 100%; padding: 16px 16px 16px 50px; border: 1px solid #bdc3c7; box-sizing: border-box; font-size: 16px; font-family: 'Montserrat', sans-serif; }
      .input-full:focus { outline: none; border-color: var(--brand-color); }

      #crmDashboard { display: none; padding: 40px 5%; max-width: 1200px; margin: 0 auto; }
      .search-bar { display: flex; gap: 15px; flex-wrap: wrap; background: white; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid var(--brand-color); }
      .search-bar input { flex: 1; min-width: 250px; padding: 15px; border: 1px solid #bdc3c7; font-size: 16px; font-family: 'Montserrat', sans-serif; }
      
      .anagrafica-card { background: white; padding: 30px; border-top: 5px solid var(--brand-color); box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
      .anagrafica-info h3 { margin: 0 0 15px 0; color: var(--brand-color); font-size: 24px; text-transform: uppercase;}
      .anagrafica-info p { margin: 8px 0; font-size: 15px; }
      
      .policies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
      .policy-card { background: white; padding: 30px; border: 1px solid #e0e0e0; border-left: 6px solid var(--brand-color); position: relative; }
      .policy-icon { position: absolute; top: 25px; right: 25px; font-size: 26px; color: #bdc3c7; }
      .policy-type { font-size: 18px; font-weight: 700; color: var(--brand-color); margin-bottom: 5px; text-transform: uppercase; }
      .policy-date { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; padding-top: 15px; border-top: 1px dashed #ecf0f1; margin-top: 15px; }
      .link-gestionale { display: block; text-align: center; padding: 12px; background: var(--brand-color); color: white; text-decoration: none; font-weight: 600; font-size: 13px; text-transform: uppercase; margin-top: 20px; transition: 0.2s;}
      .link-gestionale:hover { background: var(--brand-light); }

      .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; overflow-y: auto; }
      .modal-content { background: white; max-width: 600px; margin: 40px auto; padding: 40px; position: relative; border-top: 5px solid var(--brand-color); }
      .modal-content h3 { color: var(--brand-color); text-transform: uppercase; margin-top: 0; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
      .form-input { width: 100%; padding: 12px; border: 1px solid #bdc3c7; font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
      
      @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .anagrafica-card { flex-direction: column; align-items: flex-start; } }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="logo-container">
        <div class="logo-text">Forlenza Rio</div>
        <div class="logo-subtext">CRM Gestionale Interno</div>
      </div>
      <button class="btn-primary" onclick="location.reload()" style="padding: 10px 15px;"><i class="fas fa-sign-out-alt"></i> Disconnetti</button>
    </div>

    <!-- Schermata Login -->
    <div id="loginSection">
      <div class="login-box">
        <i class="fas fa-shield-alt" style="font-size: 45px; color: var(--brand-color); margin-bottom: 25px;"></i>
        <h2>Accesso Sicuro</h2>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPassword" class="input-full" placeholder="Password operativa">
        </div>
        <button class="btn-action" onclick="login()"><i class="fas fa-sign-in-alt"></i> Autenticazione</button>
      </div>
    </div>

    <!-- Pannello Operativo -->
    <div id="crmDashboard">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Cerca Nome, C.F., Telefono, Email, Targa o Polizza...">
        <button class="btn-action" style="margin: 0; width: auto;" onclick="cercaGlobale()" id="btnCerca"><i class="fas fa-search"></i> Avvia Ricerca</button>
        <button class="btn-primary" style="margin: 0; border: 1px solid var(--brand-color);" onclick="apriModalPolizza()"><i class="fas fa-plus"></i> Nuova Polizza</button>
      </div>
      
      <div id="messaggio-errore" style="color: var(--danger); font-weight: 600; margin-bottom: 20px; display: none;"></div>
      <div id="crmRisultati"></div>
    </div>

    <!-- Modal Inserimento Contatti -->
    <div id="modalContatti" class="modal-overlay">
      <div class="modal-content">
        <h3><i class="fas fa-address-book"></i> Integra Recapiti Cliente</h3>
        <p style="margin-bottom:20px; font-size:14px; color:#555;">Inserisci i dati mancanti. Verranno salvati su tutte le polizze associate al Codice Fiscale.</p>
        <input type="text" id="addTel" class="form-input" placeholder="Nuovo Numero di Telefono" style="margin-bottom:15px;">
        <input type="email" id="addEmail" class="form-input" placeholder="Nuovo Indirizzo Email" style="margin-bottom:25px;">
        <button class="btn-action" style="margin-top:0;" onclick="salvaContatti()" id="btnSalvaContatti">Salva nel Database</button>
        <button class="btn-primary" style="width:100%; margin-top:10px; border:1px solid #bdc3c7;" onclick="chiudiModal('modalContatti')">Annulla</button>
      </div>
    </div>

    <!-- Modal Nuova Polizza -->
    <div id="modalPolizza" class="modal-overlay">
      <div class="modal-content">
        <h3><i class="fas fa-file-contract"></i> Registra Nuova Polizza</h3>
        <div class="form-grid">
          <input type="text" id="npCompagnia" class="form-input" placeholder="Compagnia (Es. BENE ASSICURAZIONI)">
          <input type="text" id="npContraente" class="form-input" placeholder="Contraente (Nome e Cognome)">
          <input type="text" id="npRamo" class="form-input" placeholder="Ramo (Es. AUTO, CASA)">
          <input type="text" id="npPolizza" class="form-input" placeholder="Numero di Polizza">
          <input type="text" id="npData" class="form-input" placeholder="Data Scadenza (GG/MM/AAAA)">
          <input type="text" id="npPremio" class="form-input" placeholder="Premio (€)">
          <input type="text" id="npFrazionamento" class="form-input" placeholder="Frazionamento (Es. ANNUALE)">
          <input type="text" id="npCF" class="form-input" placeholder="Codice Fiscale">
          <input type="text" id="npTarga" class="form-input" placeholder="Targa (se prevista)">
          <input type="text" id="npComune" class="form-input" placeholder="Comune di Residenza">
          <input type="text" id="npTel" class="form-input" placeholder="Telefono (Opzionale)">
          <input type="text" id="npEmail" class="form-input" placeholder="Email (Opzionale)">
        </div>
        <button class="btn-action" style="margin-top:0;" onclick="salvaNuovaPolizza()" id="btnSalvaPolizza">Archivia Polizza</button>
        <button class="btn-primary" style="width:100%; margin-top:10px; border:1px solid #bdc3c7;" onclick="chiudiModal('modalPolizza')">Annulla</button>
      </div>
    </div>

    <script>
      const TOKEN = "SEGRETO_FORLENZA_2026";
      const URL_API = "https://script.google.com/macros/s/AKfycbxwCGf7req_02xigi9qO70LEKqnAMjkvUR68UoPsYcuUCQHaQVEzdEUF0tex1rg8FeS5g/exec";
      var currentCF = "";

      // 1. Gestione Accesso Sicuro
      function login() {
        if (document.getElementById('adminPassword').value === "Forlenza2026") {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('crmDashboard').style.display = 'block';
        } else {
          alert("Password di sicurezza errata.");
        }
      }

      // 2. Ricerca Globale Database
      async function cercaGlobale() {
        var query = document.getElementById('searchInput').value;
        var btn = document.getElementById('btnCerca');
        var errDiv = document.getElementById('messaggio-errore');
        
        if (!query) { errDiv.innerText = "Inserisci un parametro di ricerca."; errDiv.style.display = 'block'; return; }
        
        errDiv.style.display = 'none';
        btn.innerHTML = '<i class="fas fa-cog fa-spin"></i> Ricerca...';
        
        try {
          var res = await fetch(URL_API + "?token=" + TOKEN + "&q=" + encodeURIComponent(query));
          var dati = await res.json();
          btn.innerHTML = '<i class="fas fa-search"></i> Avvia Ricerca';
          
          if (dati.errore) { errDiv.innerText = dati.errore; errDiv.style.display = 'block'; document.getElementById('crmRisultati').innerHTML = ''; return; }
          mostraCruscotto(dati);
        } catch (e) {
          btn.innerHTML = '<i class="fas fa-search"></i> Avvia Ricerca';
          errDiv.innerText = "Errore di connessione al database."; errDiv.style.display = 'block';
        }
      }

      // 3. Renderizzazione Scheda e Polizze
      function mostraCruscotto(dati) {
        currentCF = dati.anagrafica.codFiscale;
        var html = '';
        
        // Sezione Anagrafica Unificata
        var tel = dati.anagrafica.telefono ? dati.anagrafica.telefono : '<span style="color:var(--danger)">Mancante</span>';
        var em = dati.anagrafica.email ? dati.anagrafica.email : '<span style="color:var(--danger)">Mancante</span>';
        
        html += '<div class="anagrafica-card"><div class="anagrafica-info">';
        html += '<h3><i class="fas fa-user-tie"></i> ' + (dati.anagrafica.nome || 'Dato non rilevato') + '</h3>';
        html += '<p><strong><i class="fas fa-id-card"></i> C.Fiscale:</strong> ' + (dati.anagrafica.codFiscale || 'N/D') + ' &nbsp;|&nbsp; <strong><i class="fas fa-map-marker-alt"></i> Comune:</strong> ' + (dati.anagrafica.comune || 'N/D') + '</p>';
        html += '<p><strong><i class="fas fa-phone"></i> Telefono:</strong> ' + tel + ' &nbsp;|&nbsp; <strong><i class="fas fa-envelope"></i> Email:</strong> ' + em + '</p>';
        html += '</div><div>';
        
        if (!dati.anagrafica.telefono || !dati.anagrafica.email) {
          html += '<button class="btn-primary" style="border: 2px solid var(--brand-color);" onclick="apriModalContatti()"><i class="fas fa-user-edit"></i> Integra Recapiti</button>';
        }
        html += '</div></div>';
        
        // Griglia Polizze Attive
        html += '<h2 style="color:var(--brand-color); text-transform:uppercase; margin-bottom:20px;"><i class="fas fa-folder-open"></i> Portafoglio Polizze</h2>';
        html += '<div class="policies-grid">';
        
        for (var i = 0; i < dati.polizze.length; i++) {
          var p = dati.polizze[i];
          var icona = getIconaPerTipo(p.ramo);
          var gestLink = (p.compagnia.toUpperCase().indexOf('BENE') > -1) ? 'https://www.bene.it' : 'https://www.realemutua.it';
          
          html += '<div class="policy-card">';
          html += '<i class="fas ' + icona + ' policy-icon"></i>';
          html += '<div class="policy-type">' + p.compagnia + '</div>';
          html += '<div style="font-weight:600; font-size:14px; margin-bottom:5px;">Ramo: ' + p.ramo + ' &nbsp;|&nbsp; Frazionamento: ' + p.frazionamento + '</div>';
          html += '<div style="font-family:monospace; font-size:15px; margin-bottom:10px; color:#555;">Polizza: ' + p.numero + '</div>';
          if(p.targa) { html += '<div style="font-size:14px; font-weight:600; margin-bottom:15px;"><i class="fas fa-car"></i> Targa: ' + p.targa + '</div>'; }
          
          html += '<div class="policy-date"><i class="far fa-calendar-check" style="color:var(--brand-color);"></i> Scadenza Copertura: <span style="font-weight:700;">' + p.scadenza + '</span></div>';
          html += '<div class="policy-date" style="border-top:none; padding-top:5px;"><i class="fas fa-exclamation-triangle" style="color:#e67e22;"></i> Tolleranza Legale (+15gg): <span style="color:#e67e22; font-weight:700;">' + p.scadenzaTolleranza + '</span></div>';
          html += '<a href="' + gestLink + '" target="_blank" class="link-gestionale"><i class="fas fa-external-link-square-alt"></i> Apri Portale Compagnia</a>';
          html += '</div>';
        }
        html += '</div>';
        document.getElementById('crmRisultati').innerHTML = html;
      }

      // 4. Funzioni Scrittura Database
      async function salvaContatti() {
        var btn = document.getElementById('btnSalvaContatti');
        btn.innerText = "Salvataggio in corso...";
        
        var payload = {
          token: TOKEN,
          azione: "aggiornaContatto",
          codFiscale: currentCF,
          telefono: document.getElementById('addTel').value,
          email: document.getElementById('addEmail').value
        };
        
        try {
          var res = await fetch(URL_API, { method: "POST", body: JSON.stringify(payload) });
          var esito = await res.json();
          if (esito.success) { alert(esito.message); chiudiModal('modalContatti'); cercaGlobale(); } 
          else { alert(esito.errore); }
        } catch(e) { alert("Errore di sincronizzazione"); }
        btn.innerText = "Salva nel Database";
      }

      async function salvaNuovaPolizza() {
        var btn = document.getElementById('btnSalvaPolizza');
        btn.innerText = "Registrazione in corso...";
        
        var payload = {
          token: TOKEN, azione: "aggiungiPolizza",
          compagnia: document.getElementById('npCompagnia').value,
          contraente: document.getElementById('npContraente').value,
          ramo: document.getElementById('npRamo').value,
          polizza: document.getElementById('npPolizza').value,
          dataEffetto: document.getElementById('npData').value,
          premio: document.getElementById('npPremio').value,
          frazionamento: document.getElementById('npFrazionamento').value,
          codFiscale: document.getElementById('npCF').value,
          targa: document.getElementById('npTarga').value,
          comune: document.getElementById('npComune').value,
          telefono: document.getElementById('npTel').value,
          email: document.getElementById('npEmail').value
        };
        
        if (!payload.compagnia || !payload.contraente || !payload.polizza) { alert("Compilare almeno Compagnia, Contraente e Polizza."); btn.innerText = "Archivia Polizza"; return; }
        
        try {
          var res = await fetch(URL_API, { method: "POST", body: JSON.stringify(payload) });
          var esito = await res.json();
          if (esito.success) { 
            alert(esito.message); chiudiModal('modalPolizza'); 
            document.getElementById('searchInput').value = payload.codFiscale; cercaGlobale(); 
          } else { alert(esito.errore); }
        } catch(e) { alert("Errore di registrazione"); }
        btn.innerText = "Archivia Polizza";
      }

      // Utility Gestione Interfaccia
      function getIconaPerTipo(tipo) {
        var t = tipo.toLowerCase();
        if(t.indexOf('auto') > -1 || t.indexOf('moto') > -1) return 'fa-car';
        if(t.indexOf('casa') > -1) return 'fa-home';
        if(t.indexOf('vita') > -1 || t.indexOf('salute') > -1) return 'fa-heartbeat';
        if(t.indexOf('infortuni') > -1) return 'fa-crutch';
        if(t.indexOf('azienda') > -1) return 'fa-industry';
        return 'fa-file-invoice';
      }
      function apriModalContatti() { document.getElementById('modalContatti').style.display = 'block'; }
      function apriModalPolizza() { document.getElementById('modalPolizza').style.display = 'block'; }
      function chiudiModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
  </body>
</html>
